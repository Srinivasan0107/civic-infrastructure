<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Civic Infrastructure Memory — Municipal Decision Support Platform with Recurring Failure Intelligence" />
    <!-- Google Fonts: Inter + Noto Sans Indic scripts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Noto+Sans:wght@400;500;600;700&family=Noto+Sans+Kannada:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&family=Noto+Sans+Tamil:wght@400;500;600;700&family=Noto+Sans+Telugu:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>Civic Infrastructure Memory — Municipal Decision Platform</title>
    <script>
      // Suppress harmless browser extension errors (e.g. translate-page / save-page context menu scripts)
      window.addEventListener('unhandledrejection', function (e) {
        if (e.reason && typeof e.reason.message === 'string' && e.reason.message.includes('Cannot find menu item with id')) {
          e.preventDefault();
          e.stopImmediatePropagation();
        }
      });
      window.addEventListener('error', function (e) {
        if (e.message && e.message.includes('Cannot find menu item with id')) {
          e.preventDefault();
          e.stopImmediatePropagation();
        }
      });
    </script>
  </head>
  <body class="bg-slate-100/80 text-slate-800 antialiased selection:bg-teal-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
