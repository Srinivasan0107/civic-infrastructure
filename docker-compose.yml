version: '3.8'

services:
  mongodb:
    image: mongo:8.0
    container_name: civic-memory-mongodb
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    command: ["mongod", "--bind_ip_all"]
    volumes:
      - civic_memory_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: civic-memory-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      - MONGODB_URI=mongodb://mongodb:27017
      - MONGODB_DATABASE=civic_memory
      - APP_ENV=development
      - API_HOST=0.0.0.0
      - API_PORT=8000
    volumes:
      - ./.model-cache:/app/.model-cache
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  civic_memory_mongo_data:
    name: civic_memory_mongo_data
