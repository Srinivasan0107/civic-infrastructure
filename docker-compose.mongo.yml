services:
  mongodb:
    image: mongo:8.0
    container_name: civic-memory-mongodb
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    command: ["mongod", "--bind_ip_all"]
    volumes:
      - civic_memory_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

volumes:
  civic_memory_mongo_data:
    name: civic_memory_mongo_data
